<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 550px;
            padding: 35px;
            background: #1e293b;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #334155;
            color: white;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #38bdf8;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #334155;
            border-radius: 10px;
        }

        .result h2 {
            margin-top: 0;
        }

        .checks {
            margin-top: 15px;
        }

        .checks p {
            margin: 8px 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔐 Password Strength Checker</h1>

        <p class="subtitle">
            Check how strong your password is
        </p>

        <form method="POST">

            <label for="password">Enter Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Check Password
            </button>

        </form>

        {% if result is not none %}

        <div class="result">

            <h2>Strength: {{ result }}</h2>

            {% if checks %}

            <div class="checks">

                {% for check in checks %}
                    <p>{{ check }}</p>
                {% endfor %}

            </div>

            {% endif %}

        </div>

        {% endif %}

    </div>

</body>
</html>
