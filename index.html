```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .checks {
            margin-top: 20px;
        }

        .check {
            padding: 8px;
            margin: 5px 0;
            border-radius: 6px;
            background: #f3f4f6;
        }

        .valid {
            color: green;
        }

        .invalid {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Password Strength Checker</h1>

    <input
        type="password"
        id="password"
        placeholder="Enter your password"
    >

    <button onclick="checkPassword()">Check Password</button>

    <div id="result"></div>

    <div class="checks">

        <div class="check" id="length">
            ❌ At least 8 characters
        </div>

        <div class="check" id="uppercase">
            ❌ Contains uppercase letter
        </div>

        <div class="check" id="lowercase">
            ❌ Contains lowercase letter
        </div>

        <div class="check" id="number">
            ❌ Contains a number
        </div>

        <div class="check" id="special">
            ❌ Contains special character (@ # $ % !)
        </div>

    </div>

</div>

<script>

function checkPassword() {

    const password = document.getElementById("password").value;

    const length = password.length >= 8;
    const uppercase = /[A-Z]/.test(password);
    const lowercase = /[a-z]/.test(password);
    const number = /[0-9]/.test(password);
    const special = /[@#$%!]/.test(password);

    let score = 0;

    if (length) score++;
    if (uppercase) score++;
    if (lowercase) score++;
    if (number) score++;
    if (special) score++;

    let strength;

    if (score <= 2) {
        strength = "Weak";
    }
    else if (score <= 4) {
        strength = "Medium";
    }
    else {
        strength = "Strong";
    }

    document.getElementById("result").textContent =
        "Strength: " + strength;

    updateCheck(
        "length",
        length,
        "At least 8 characters"
    );

    updateCheck(
        "uppercase",
        uppercase,
        "Contains uppercase letter"
    );

    updateCheck(
        "lowercase",
        lowercase,
        "Contains lowercase letter"
    );

    updateCheck(
        "number",
        number,
        "Contains a number"
    );

    updateCheck(
        "special",
        special,
        "Contains special character (@ # $ % !)"
    );
}

function updateCheck(id, valid, text) {

    const element = document.getElementById(id);

    if (valid) {

        element.textContent = "✅ " + text;
        element.className = "check valid";

    }
    else {

        element.textContent = "❌ " + text;
        element.className = "check invalid";

    }
}

</script>

</body>
</html>
